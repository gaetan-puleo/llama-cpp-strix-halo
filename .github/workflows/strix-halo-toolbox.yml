name: Strix Halo Toolbox (ROCm)

# Builds THIS repo into a Toolbx-ready ROCm image for AMD Strix Halo (gfx1151)
# and publishes it to GitHub Container Registry (ghcr.io). Auth is the built-in
# GITHUB_TOKEN — no secrets to configure.

on:
  workflow_dispatch:
  push:
    branches: [strix-halo-rework]
    paths:
      - '.devops/strix-halo.Dockerfile'
      - '.github/workflows/strix-halo-toolbox.yml'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}   # ghcr.io/<owner>/<repo>
  TAG: rocm-7.2.4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build timestamp
        run: echo "BUILD_TS=$(date +%Y%m%dT%H%M%S)" >> $GITHUB_ENV

      - name: Build & push
        shell: bash
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE}"
          IMG="${IMG,,}"                       # ghcr requires lowercase
          IMMUTABLE="${IMG}:${TAG}_${BUILD_TS}"
          CHANNEL="${IMG}:${TAG}"

          echo "→ Building .devops/strix-halo.Dockerfile"
          docker build --no-cache -t "${CHANNEL}" -f .devops/strix-halo.Dockerfile .

          echo "→ Smoke test"
          docker run --rm "${CHANNEL}" llama-cli --version || { s=$?; [[ $s -eq 0 || $s -eq 1 ]]; }
          docker run --rm "${CHANNEL}" llama-server --help >/dev/null || { s=$?; [[ $s -eq 0 || $s -eq 1 ]]; }

          echo "→ Push ${CHANNEL} and ${IMMUTABLE}"
          docker tag "${CHANNEL}" "${IMMUTABLE}"
          docker push "${CHANNEL}"
          docker push "${IMMUTABLE}"
